[project]
authors = [
  {name = "How", email = "how@melnycz.uk"},
]
dependencies = [
  "av>=18.0.0",
  "diffusers==0.34.0",
  "einops>=0.8.0",
  "ftfy==6.3.1",
  "imageio>=2.37.0",
  "imageio-ffmpeg==0.5.1",
  "numpy==1.26.4",
  "tokenizers==0.21.4",
  "torch==2.13.0",
  "tqdm==4.67.1",
  "transformers==4.53.2",
  "wget==3.2",
]
description = "SkyReels V3 Single Shot Video Extension, for local MPS inference"
name = "skyreels-v3"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[project.scripts]
skyreels-v3 = "skyreels_v3.cli:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.0,<0.13.0"]
